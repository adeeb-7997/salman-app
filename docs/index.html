<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF4D6">
  <title>ألعاب سلمان</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== الشاشة الرئيسية (للطفل) ===== -->
  <main id="home" class="screen active">
    <header class="home-header">
      <h1 data-i18n="appTitle">ألعاب سلمان</h1>
      <button id="lockBtn" class="hold-btn" type="button" aria-label="parent">
        <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
        <span>🔒</span>
      </button>
    </header>

    <div class="tiles">
      <button class="tile t-who" type="button" data-game="who">
        <span class="emoji">👨‍👩‍👦</span>
        <span class="label" data-i18n="game_who"></span>
      </button>
      <button class="tile t-peek" type="button" data-game="peek">
        <span class="emoji">🏠</span>
        <span class="label" data-i18n="game_peek"></span>
      </button>
      <button class="tile t-bal" type="button" data-game="balloons">
        <span class="emoji">🎈</span>
        <span class="label" data-i18n="game_balloons"></span>
      </button>
      <button class="tile t-paint" type="button" data-game="paint">
        <span class="emoji">🎨</span>
        <span class="label" data-i18n="game_paint"></span>
      </button>
    </div>
  </main>

  <!-- ===== لعبة: مين هذا؟ ===== -->
  <section id="game-who" class="screen game">
    <button class="hold-btn home-btn" type="button" aria-label="home">
      <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
      <span>🏠</span>
    </button>
    <div id="whoStage" class="who-stage">
      <div id="whoCard" class="who-card"><img id="whoImg" alt=""></div>
      <div id="whoName" class="who-name"></div>
    </div>
    <div id="whoEmpty" class="empty-game" hidden>
      <span class="big">👨‍👩‍👦</span>
      <p data-i18n="noPeople"></p>
    </div>
  </section>

  <!-- ===== لعبة: الغميضة ===== -->
  <section id="game-peek" class="screen game">
    <button class="hold-btn home-btn" type="button" aria-label="home">
      <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
      <span>🏠</span>
    </button>
    <div id="peekHouse" class="house">
      <div class="roof"></div>
      <div class="walls">
        <div id="peekWindows" class="windows"></div>
        <div class="door"></div>
      </div>
    </div>
    <div id="peekEmpty" class="empty-game" hidden>
      <span class="big">🏠</span>
      <p data-i18n="noPeople"></p>
    </div>
  </section>

  <!-- ===== لعبة: البالونات ===== -->
  <section id="game-balloons" class="screen game">
    <button class="hold-btn home-btn" type="button" aria-label="home">
      <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
      <span>🏠</span>
    </button>
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
    <div id="sky" class="sky"></div>
  </section>

  <!-- ===== لعبة: الرسم ===== -->
  <section id="game-paint" class="screen game">
    <button class="hold-btn home-btn" type="button" aria-label="home">
      <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>
      <span>🏠</span>
    </button>
    <canvas id="paintCanvas"></canvas>
    <button id="paintClear" class="paint-clear" type="button" aria-label="clear">🧽</button>
  </section>

  <!-- ===== وضع الوالدين ===== -->
  <section id="parent" class="screen">
    <header class="p-header">
      <h2 data-i18n="parentTitle"></h2>
      <button id="closeParent" class="btn ghost" type="button" data-i18n="close"></button>
    </header>

    <div class="p-body">
      <div class="card">
        <div class="row-between">
          <h3 data-i18n="family"></h3>
          <button id="addBtn" class="btn primary" type="button" data-i18n="addPerson"></button>
        </div>
        <ul id="peopleList" class="people"></ul>
        <p id="emptyMsg" class="muted" data-i18n="empty"></p>
      </div>

      <div class="card">
        <h3 data-i18n="colorsTitle"></h3>
        <p class="muted small" data-i18n="colorsHint"></p>
        <ul id="colorList" class="people"></ul>
      </div>

      <div class="card">
        <h3 data-i18n="settings"></h3>
        <label class="field">
          <span data-i18n="language"></span>
          <select id="langSelect">
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
    </div>
  </section>

  <!-- ===== نافذة إضافة شخص ===== -->
  <div id="personDialog" class="modal hidden">
    <div class="modal-card">
      <h3 data-i18n="addPerson"></h3>

      <label class="field">
        <span data-i18n="name"></span>
        <input id="pName" type="text" maxlength="30" data-i18n-ph="namePh">
      </label>

      <div class="field">
        <span data-i18n="photo"></span>
        <label class="photo-pick">
          <img id="pPhotoPreview" alt="" hidden>
          <span id="pPhotoHint" data-i18n="pickPhoto"></span>
          <input id="pPhoto" type="file" accept="image/*" hidden>
        </label>
      </div>

      <div class="field">
        <span data-i18n="voice"></span>
        <p class="muted small" data-i18n="voiceHint"></p>
        <div class="rec-row">
          <button id="recBtn" class="btn rec" type="button" data-i18n="record"></button>
          <button id="playBtn" class="btn ghost" type="button" data-i18n="play" disabled></button>
        </div>
        <p id="recStatus" class="muted small"></p>
      </div>

      <div class="modal-actions">
        <button id="savePerson" class="btn primary" type="button" data-i18n="save"></button>
        <button id="cancelPerson" class="btn ghost" type="button" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/i18n.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/games/who.js"></script>
  <script src="js/games/peek.js"></script>
  <script src="js/games/balloons.js"></script>
  <script src="js/games/paint.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
